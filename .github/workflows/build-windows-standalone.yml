name: Build Windows Standalone EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'standalone.spec'
      - '.github/workflows/build-windows-standalone.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build one-file EXE
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean standalone.spec

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\SoundCloudReleaseTracker.exe')) {
            throw 'EXE was not created.'
          }
          Get-Item 'dist\SoundCloudReleaseTracker.exe' | Format-List Name,Length,LastWriteTime

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: SoundCloudReleaseTracker-Windows-Standalone
          path: dist/SoundCloudReleaseTracker.exe
          if-no-files-found: error
          retention-days: 30
