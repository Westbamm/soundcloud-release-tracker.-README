name: Build WPF Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'native-wpf/**'
      - 'native/Models.cs'
      - 'native/AppConfig.cs'
      - 'native/CredentialStore.cs'
      - 'native/TrackStore.cs'
      - 'native/MciPlayer.cs'
      - 'native/SoundCloudApiClient.cs'
      - 'native/SoundCloudAutoSetup.cs'
      - '.github/workflows/build-wpf-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build WPF
        shell: pwsh
        run: dotnet build native-wpf/ReleaseRadar.Wpf.csproj -c Release

      - name: Publish WPF portable folder
        shell: pwsh
        run: >
          dotnet publish native-wpf/ReleaseRadar.Wpf.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=None
          -o publish/release-radar-wpf

      - name: Bundle Node runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'publish/release-radar-wpf/tools' | Out-Null
          $node = (Get-Command node).Source
          Copy-Item $node 'publish/release-radar-wpf/tools/node.exe' -Force

      - name: Verify package
        shell: pwsh
        run: |
          if (-not (Test-Path 'publish/release-radar-wpf/ReleaseRadar.exe')) {
            throw 'ReleaseRadar.exe was not created.'
          }
          if (-not (Test-Path 'publish/release-radar-wpf/tools/node.exe')) {
            throw 'Bundled Node runtime was not created.'
          }
          if (Test-Path 'publish/release-radar-wpf/python*.dll') {
            throw 'Unexpected Python runtime found.'
          }
          Get-Item 'publish/release-radar-wpf/ReleaseRadar.exe' | Format-List Name,Length,LastWriteTime

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'publish/release-radar-wpf/*' -DestinationPath 'ReleaseRadar-v7.0-WPF-Windows-x64.zip' -Force

      - name: Upload WPF app
        uses: actions/upload-artifact@v4
        with:
          name: ReleaseRadar-v7.0-WPF-Windows-x64
          path: ReleaseRadar-v7.0-WPF-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
