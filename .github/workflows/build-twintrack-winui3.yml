name: Build TWINTRACK WinUI3 Portable

on:
  push:
    branches: [ main ]
    paths:
      - 'twintrack-winui-src/**'
      - '.github/workflows/build-twintrack-winui3.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore .\twintrack-winui-src\TwinTrack\TwinTrack.csproj -r win-x64

      - name: Publish self-contained x64
        shell: pwsh
        run: >
          dotnet publish .\twintrack-winui-src\TwinTrack\TwinTrack.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Platform=x64
          -p:WindowsAppSDKSelfContained=true
          -p:DebugType=None
          -o .\publish

      - name: Verify EXE
        shell: pwsh
        run: |
          if (-not (Test-Path '.\publish\TWINTRACK.exe')) {
            Write-Host 'Publish contents:'
            Get-ChildItem '.\publish' -Recurse | Format-Table FullName,Length
            throw 'TWINTRACK.exe was not created.'
          }
          Get-Item '.\publish\TWINTRACK.exe' | Format-List Name,Length,LastWriteTime

      - name: Smoke launch
        shell: pwsh
        run: |
          $start = Get-Date
          $p = Start-Process -FilePath '.\publish\TWINTRACK.exe' -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) {
            Write-Host "TWINTRACK exited with code $($p.ExitCode)"
            Write-Host '--- Recent Application errors ---'
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$start.AddSeconds(-2)} -ErrorAction SilentlyContinue |
              Where-Object { $_.LevelDisplayName -in @('Error','Critical') -or $_.ProviderName -in @('Application Error','.NET Runtime','Windows Error Reporting') } |
              Select-Object TimeCreated,ProviderName,Id,LevelDisplayName,Message |
              Format-List
            throw "TWINTRACK.exe exited during smoke test with code $($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force
          Write-Host 'TWINTRACK smoke launch PASS'

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path '.\publish\*' -DestinationPath '.\TWINTRACK_WINUI3_X64_PORTABLE.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWINTRACK_WINUI3_X64_PORTABLE
          path: TWINTRACK_WINUI3_X64_PORTABLE.zip
          if-no-files-found: error
          retention-days: 30
